name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      # 强制读取验证：宪法缺失或条款不全时直接失败
      - name: Verify constitution
        run: python scripts/verify_constitution.py

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Ruff (format check)
        run: python -m ruff format --check .

      - name: Pytest
        run: python -m pytest -q

      # Frontend has pure functions that pytest cannot reach. Node is preinstalled
      # on the runner; the tests use only the built-in assert module (no deps).
      - name: Node tests (frontend pure functions)
        run: node tests/js/overview-tones.mjs

      # Guards a class of bug that bit us four times in one night: a selector or
      # key that silently matches nothing (no error, just no effect).
      #   - CSS var typo (--border when the token is --line)
      - name: Cross-check room colour keys against server room order
        run: python scripts/check_room_colours.py

      # Guards "green locally, broken when deployed": import the plugin the way
      # AstrBot does (as a package, with no top-level `core`) and require every
      # module entry plus every pure-logic file to import. On 2026-09-29 an
      # absolute `from core.storage import ...` passed all 694 tests and then
      # unloaded the entire plugin on the server.
      # Pytest already runs this via tests/test_astrbot_load_form.py; this step
      # exists so the failure is legible in the CI log instead of buried.
      - name: Plugin imports under AstrBot's load form
        run: python scripts/check_astrbot_load_form.py
