name: astrbot_plugin_arknights_toolbox
display_name: 明日方舟工具箱
short_desc: 基建换班到点提醒，三班时刻自己填
desc: |-
  到点提醒你去《明日方舟》基建换班。

  **它能做什么**

  - 按你填的三班时刻，在每班换班前推一条提醒（当前班次、下一班几点开始）
  - 提前量可调，默认提前 10 分钟
  - 三个班次的名字、开始时刻、时长全部自己填
  - 关掉之后不会再注册任何定时任务

  **怎么用**

  1. 装好插件，在配置里把三个班次的「名称 / 开始时刻 / 时长」填成你自己的排班
     （三段时长必须正好合计 24 小时，并且首尾相接）
  2. 私聊机器人发 `/ak bind`，把提醒发到这个会话
  3. 之后到点会自动收到提醒；想先看效果可以发 `/ak test`

  **指令**

  - `/ak bind` —— 把提醒发到当前会话
  - `/ak status` —— 看当前班次、下一班倒计时、最近几条发送记录
  - `/ak test` —— 立刻收一条测试提醒，不改动任何设置

  **说明**

  私聊任何人都能用（绑定只影响自己）。群聊里只有管理员能操作——在群里绑定会把提醒推给全体成员，所以做了限制。

  提醒目标目前只有一个：重新 `/ak bind` 会把它改到新的会话。
