<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>基建换班提醒</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <h1>基建换班提醒</h1>
        <button id="refresh" type="button">刷新</button>
      </header>

      <p id="status-line" class="muted">正在读取…</p>

      <section class="cards">
        <article class="card">
          <h2>当前班次</h2>
          <p id="current" class="big">—</p>
        </article>
        <article class="card">
          <h2>下一班</h2>
          <p id="upcoming" class="big">—</p>
          <p id="upcoming-change" class="muted"></p>
          <p id="countdown" class="countdown">—</p>
        </article>
      </section>

      <section class="card">
        <h2>绑定与推送</h2>
        <dl class="kv">
          <dt>提醒目标</dt>
          <dd id="binding">—</dd>
          <dt>提前量</dt>
          <dd id="lead">—</dd>
          <dt>推送状态</dt>
          <dd id="breaker">—</dd>
          <dt>排班表</dt>
          <dd id="roster">—</dd>
        </dl>
        <p class="muted">
          改班次时刻请到插件配置页；切换提醒目标请在 QQ 里发 <code>/ak bind</code>。
        </p>
      </section>

      <section class="card">
        <h2>最近发送</h2>
        <ul id="recent" class="recent">
          <li class="muted">—</li>
        </ul>
      </section>

      <section class="card">
        <h2>编辑班次</h2>
        <p class="muted">
          三段时长之和必须正好 24 小时，且上一班的结束时刻正好等于下一班的开始时刻。
          不符合会当场拒绝保存并说明原因。
        </p>
        <form id="shifts-form" class="shifts">
          <div class="row head-row">
            <span>班次</span><span>名称</span><span>开始时刻</span><span>时长（小时）</span>
          </div>
          <div class="row">
            <span>第一班</span>
            <input id="s1-name" type="text" autocomplete="off" />
            <input id="s1-start" type="text" inputmode="numeric" placeholder="08:00" autocomplete="off" />
            <input id="s1-hours" type="number" min="1" max="24" step="1" />
          </div>
          <div class="row">
            <span>第二班</span>
            <input id="s2-name" type="text" autocomplete="off" />
            <input id="s2-start" type="text" inputmode="numeric" placeholder="20:00" autocomplete="off" />
            <input id="s2-hours" type="number" min="1" max="24" step="1" />
          </div>
          <div class="row">
            <span>第三班</span>
            <input id="s3-name" type="text" autocomplete="off" />
            <input id="s3-start" type="text" inputmode="numeric" placeholder="02:00" autocomplete="off" />
            <input id="s3-hours" type="number" min="1" max="24" step="1" />
          </div>
          <div class="row">
            <span>提前量</span>
            <input id="lead-input" type="number" min="0" max="180" step="1" />
            <span class="muted">分钟</span>
            <span></span>
          </div>
          <div class="actions">
            <button id="save-shifts" type="submit">保存并生效</button>
            <span id="save-hint" class="muted"></span>
          </div>
        </form>
      </section>

      <p id="error" class="error" hidden></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
