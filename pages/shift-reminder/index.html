<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>基建换班提醒</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <h1>基建换班提醒</h1>
        <button id="refresh" type="button">刷新</button>
      </header>

      <p id="status-line" class="muted">正在读取…</p>

      <section class="cards">
        <article class="card">
          <h2>当前班次</h2>
          <p id="current" class="big">—</p>
        </article>
        <article class="card">
          <h2>下一班</h2>
          <p id="upcoming" class="big">—</p>
          <p id="upcoming-change" class="muted"></p>
          <p id="countdown" class="countdown">—</p>
        </article>
      </section>

      <section class="card">
        <h2>班次时间轴</h2>
        <p class="muted">
          拖动<b>白色圆点</b>调整换班时刻；拖动<b>色块本身</b>可以整体平移（等于改第一班几点开始）。
          三段永远首尾相接、合计 24 小时，所以拖不出非法配置。
        </p>

        <div
          id="timeline"
          class="timeline"
          role="group"
          aria-label="24 小时班次时间轴"
        ></div>

        <p id="timeline-hint" class="muted timeline-hint"></p>

        <div id="editors" class="editors"></div>

        <div class="lead-row">
          <label for="lead-input">提前量</label>
          <input id="lead-input" type="number" min="0" max="180" step="1" inputmode="numeric" />
          <span class="muted">分钟</span>
        </div>
        <p id="lead-hint" class="muted"></p>

        <div class="actions">
          <button id="save-shifts" type="button">保存并生效</button>
          <button id="reset-shifts" type="button" class="ghost">撤销改动</button>
          <span id="save-hint" class="muted"></span>
        </div>
      </section>

      <section class="card">
        <h2>绑定与推送</h2>
        <dl class="kv">
          <dt>提醒目标</dt>
          <dd id="binding">—</dd>
          <dt>提前量</dt>
          <dd id="lead">—</dd>
          <dt>推送状态</dt>
          <dd id="breaker">—</dd>
          <dt>排班表</dt>
          <dd id="roster">—</dd>
        </dl>
        <p class="muted">切换提醒目标请在 QQ 里发 <code>/ak bind</code>。</p>
      </section>

      <section class="card">
        <h2>排班表</h2>
        <p class="muted">
          上传一份基建排班表（<a href="https://riic.autos/" target="_blank" rel="noreferrer">riic.autos</a>
          导出、MAA 能导入的那种 JSON），提醒里就会带上「这一班哪个房间该上谁」。
          不导入也能正常用，只是提醒里不会列出干员。
        </p>

        <div class="upload-row">
          <input
            id="roster-file"
            type="file"
            accept=".json,application/json"
            aria-label="选择排班表 JSON 文件"
          />
          <button id="roster-upload" type="button">上传并导入</button>
        </div>
        <p id="upload-hint" class="muted"></p>

        <div id="duration-suggestion" class="suggestion" hidden>
          <p id="duration-suggestion-text" class="muted"></p>
          <button id="apply-durations" type="button">按排班表填入班次时长</button>
        </div>

        <div id="roster-summary" class="roster-summary"></div>
        <div id="roster-detail" class="roster"></div>
      </section>

      <section class="card">
        <h2>最近发送</h2>
        <ul id="recent" class="recent">
          <li class="muted">—</li>
        </ul>
      </section>

      <p id="error" class="error" hidden></p>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
