line-length = 100
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = ["E501"] # line length is the formatter's job

[lint.flake8-tidy-imports]
# 允许同包内相对导入（modules/x/a.py -> modules/x/b.py），禁止向上越级。
ban-relative-imports = "parents"

# 架构红线（见 docs/architecture/rules.md §2、§3）：
# 纯逻辑层不得依赖 AstrBot 框架，也不得改用标准库 logging。
# 需要框架的文件在下面的 per-file-ignores 里单独放行。
[lint.flake8-tidy-imports.banned-api]
"astrbot".msg = "纯逻辑层禁止依赖 AstrBot；框架调用请留在 main.py / core/module.py / */module.py。"
"logging".msg = "请使用 AstrBot 提供的 logger（from astrbot.api import logger）。"

[lint.per-file-ignores]
# 框架胶水层允许 import astrbot（但仍禁止 logging）。
# 注意：core/module.py 与 core/registry.py **不在此列**——它们刻意零框架依赖，
# 提前开例外等于给自己留后门（独立审查意见）。真需要时再加。
"main.py" = ["TID"]
# 装配层允许父级相对导入：插件以包形式被 AstrBot 加载时 `core` 不在 sys.path，
# `from ..core.x import y` 是唯一可达方式（审查/裁定见 docs/architecture/extension.md §2）。
"modules/*/module.py" = ["TID", "TID252"]
# **纯转出壳**（只把 core 的符号再导出、不含实现）用与装配层**同一套**回退链，
# 因此同样需要父级相对导入那一支（见 docs/architecture/extension.md §4.1）。
#
# 为什么逐文件写具体路径、而**不**用 `modules/*/schedule.py` 之类的通配：
# `schedule.py` 是个"看起来就该放排班逻辑"的名字。哪天某个模块真在这个文件里写实现，
# 通配豁免会**静默地**连它一起放开——本项目反复吃过「静默生效/静默失效」的亏
# （rules.md §2；2026-09-29 的多次事故）。一行一个文件意味着新增壳时必须在这里
# **显式加一行**，评审看得见，也就会回头读这段理由。
#
# 判据（extension.md §4.1）：壳里只有 import 与 `__all__`、没有任何计算；
# 对象级证据是 tests/test_core_shifts.py 的「同一批对象」断言。
"modules/shift_reminder/schedule.py" = ["TID", "TID252"]
"tests/*" = ["TID", "SIM"]

[lint.isort]
known-first-party = ["core", "modules"]
